name: wanfu
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wanfu
      MYSQL_USER: wanfu
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u wanfu -D wanfu -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/wanfu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: wanfu
      DB_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请配置 ADMIN_PASSWORD}
      APP_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
  web:
    build: ./web
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-18088}:80"
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
  uploads:

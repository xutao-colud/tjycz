server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    hikari:
      maximum-pool-size: 12
      connection-timeout: 15000
app:
  privacy:
    consent-required: ${GUARDIAN_CONSENT_REQUIRED:false}
  integrations:
    ocr-provider: ${OCR_PROVIDER:}
    ocr-url: ${OCR_URL:}
    ocr-key-file: ${OCR_KEY_FILE:}
    wechat-arrival-template-id: ${WECHAT_ARRIVAL_TEMPLATE_ID:}
    wechat-departure-template-id: ${WECHAT_DEPARTURE_TEMPLATE_ID:}
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/wanfu;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
server:
  port: ${PORT:18080}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
